# Every known claim below cites evidence that was read on the recorded date. Anything that the
# cited documentation does not state is left as status: unknown with a null value.
schema_version: 1
id: google-analytics-4
slug: google-analytics-4
name: Google Analytics 4
aliases:
  - GA4
  - Google Analytics
summary: >-
  Google publishes an official GA4 server for Claude, but it is experimental, read-only, and the
  only Claude app its documentation names is Claude Code. The other routes trade that friction for
  scheduling, blending, or plain CSV. This guide compares what each exposes and the GA4 limits that
  follow you down every path.

meta_description: Compare ways to connect Google Analytics 4 to Claude, with evidence for every capability claim.

research:
  searched_on: "2026-10-04"
  checked_urls:
    - https://docs.coupler.io/sources/category/ppc/google-analytics
    - https://docs.coupler.io/sources/category/ppc/google-analytics/data-overview
    - https://docs.coupler.io/sources/category/ppc/google-analytics/faq
    - https://docs.coupler.io/sources/category/ppc/google-analytics/common-issues
    - https://docs.coupler.io/destinations/categories/ai/claude
    - https://docs.coupler.io/destinations/categories/ai/claude/faq
    - https://docs.coupler.io/destinations/categories/ai/claude/common-issues
    - https://docs.coupler.io/ai/mcp
    - https://claude.com/connectors/coupler-io
    - https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
    - https://support.claude.com/en/articles/8241126-upload-files-to-claude
    - https://github.com/googleanalytics/google-analytics-mcp
    - https://developers.google.com/analytics/devguides/MCP
    - https://github.com/zapier/connectors/tree/main/apps/google-analytics
    - https://support.google.com/analytics/answer/9317657
  coverage_note: >-
    Four routes were researched on 4 October 2026: the Coupler.io data platform, Google's own
    experimental MCP server, Zapier's independent connector package, and a manual report export
    uploaded into a conversation. No dedicated GA4 entry was reachable in Claude's connector
    directory at the obvious addresses, though several multi-source connectors list GA4 among the
    platforms they cover; the directory cannot be searched exhaustively, so no claim is made that
    none exists.

