recommendations:
  - job: Tracking GA4 trends over time or alongside ad spend
    option_id: coupler-io
    reason: >-
      Scheduled imports keep a copy of data that GA4 itself deletes after 2 or 14 months, queries run
      against the stored dataset rather than the API, and one data flow can join GA4 with Google Ads
      or CRM data before Claude sees it.
    evidence_ids: [cpl-ga4-faq, cpl-mcp, cpl-ga4-overview]
  - job: Asking live GA4 questions without a third party in the path
    option_id: google-analytics-mcp
    reason: >-
      It is Google's own server, read-only by design, and it calls the Analytics APIs directly from
      your machine. Expect a Google Cloud project, Application Default Credentials, and Claude Code.
    evidence_ids: [google-ga4-mcp-docs, google-ga4-mcp-repo]
  - job: Managing GA4 key events or custom definitions from a conversation
    option_id: zapier-google-analytics
    reason: >-
      It is the only researched route that can create and archive custom dimensions and metrics,
      manage key events, and send server-side events, which Google's own read-only server cannot do.
    evidence_ids: [zapier-ga4-connector]
  - job: A one-off question about a report you can already see
    option_id: manual-export
    reason: >-
      Nothing to install or authorise, and a CSV download carries up to 100,000 rows, which covers
      most single reports.
    evidence_ids: [ga4-export-help, claude-upload-files]

faq:
  - question: Is there an official Google Analytics connector in Claude's directory?
    answer: >-
      No dedicated GA4 entry was reachable at the obvious directory addresses on the research date.
      Google does publish its own MCP server, but it runs locally and its documentation sets up
      Claude Code only. Several multi-source connectors list Google Analytics among the platforms
      they cover. Claude's directory cannot be searched exhaustively, so this is a "not found at the
      expected address" rather than a claim that no entry exists.
    evidence_ids: [google-ga4-mcp-repo, google-ga4-mcp-docs]
  - question: Can Claude change my GA4 configuration?
    answer: >-
      Only on one route. Google's own server is read-only and states it cannot edit your Analytics
      configuration or settings. Coupler.io is read-only against GA4. The Zapier connector is the
      exception: it can create and archive custom dimensions and metrics, manage key events, and
      send server-side events.
    evidence_ids: [google-ga4-mcp-docs, cpl-mcp, zapier-ga4-connector]
  - question: Why can I only pick 10 metrics?
    answer: >-
      That ceiling is the GA4 Data API's, not any one tool's: up to 10 metrics and 9 dimensions per
      report. The documented workaround is to run more than one report and join them, which is
      easier on a route that stores the results than one that answers inside a conversation.
    evidence_ids: [cpl-ga4-data]
  - question: How far back can Claude see my analytics?
    answer: >-
      As far as GA4 keeps it. A GA4 property retains data for either 2 or 14 months depending on its
      setting, and no route can read past that. If you need longer history, the documented approach
      is to export on a schedule and store the results before they expire.
    evidence_ids: [cpl-ga4-faq]
  - question: Will the numbers Claude reports match the GA4 interface?
    answer: >-
      Usually, with two documented caveats. GA4 may withhold rows representing too few users through
      thresholding, especially when Google Signals is on, and Total users broken down by a dimension
      will not sum to the overall total. Data pulled through the Data API is unsampled, and most
      metrics settle within a few hours, though some take 24 to 48 hours.
    evidence_ids: [cpl-ga4-data]
  - question: My export has missing dates. What happened?
    answer: >-
      Two documented causes. On the free plan only the first 1,000 rows are exported, which shows up
      as gaps. The other is an incompatible metric and dimension pair, which returns a 400 error
      rather than partial data. GA4's per-property API quotas can also bite when several flows pull
      the same property at once.
    evidence_ids: [cpl-ga4-issues]
  - question: The connector shows as connected but Claude cannot see my data. Why?
    answer: >-
      On individual Claude Free and Pro plans there is a documented defect where the official
      Coupler.io connector connects but its tools never load, so Claude cannot query the datasets.
      Coupler.io documents a custom connector URL as a workaround and reports that it works on all
      plans.
    evidence_ids: [cpl-claude-free-pro]

