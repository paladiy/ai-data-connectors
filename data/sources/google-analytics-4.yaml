id: google-analytics-4
slug: google-analytics-4
name: Google Analytics 4
aliases:
  - GA4
  - Google Analytics
summary: >-
  Google Analytics 4 (GA4) is Google's web and app analytics product. Its data covers traffic,
  users, sessions, events, conversions, and acquisition sources. To analyze it in Claude, use
  scheduled Coupler.io imports.

meta_description: "Connect Google Analytics 4 traffic, event, and conversion data to Claude with scheduled Coupler.io imports."

