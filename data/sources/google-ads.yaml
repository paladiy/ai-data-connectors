options:
  - id: coupler-io
    name: Coupler.io
    provider: Coupler.io
    method: data_platform
    description: >-
      Coupler.io imports a Google Ads report on a schedule and exposes the result to Claude through
      its own MCP server, so Claude queries a stored dataset instead of calling the Ads API during
      the conversation.

    maintainer:
      status: known
      value: third_party
      evidence_ids: [cpl-mcp, cpl-claude-destination]
      note: Coupler.io builds and runs this connector and its MCP server.

    route_status:
      status: known
      value: available
      evidence_ids: [cpl-claude-destination, cpl-ads-claude-page]

    directory_listing:
      status: known
      value: https://claude.com/connectors/coupler-io
      evidence_ids: [dir-coupler-io]
      note: >-
        The entry is marked Anthropic verified, credited to Coupler.io, added in November 2025, and
        records sign-in as required. It lists four tools: get-data, get-schema, list-dataflows, and
        get-dataflow

    links:
      overview: https://docs.coupler.io/sources/category/ppc/google-ads
      setup: https://docs.coupler.io/destinations/categories/ai/claude

    # The Claude destination page names each of these surfaces for a single web connector.
    surfaces:
      claude_web:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination, cpl-claude-faq]
      claude_desktop:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Local use with Claude Desktop is also described through a Desktop Extension
      claude_code:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Connected with the /mcp command rather than the web connector
      cowork:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]

    access:
      status: known
      value: read
      evidence_ids: [cpl-mcp, dir-coupler-io]
      note: >-
        Queries against imported data are read-only, and nothing in either source describes changing
        campaigns, budgets, or bids. Coupler.io's own documentation also describes tools that change
        your Coupler.io workspace, such as creating a data flow or triggering a run

    data_available:
      status: known
      value:
        - "Over 30 report types in total"
        - "Frequently used: Campaign performance, Keywords performance, Ad group performance, Ad performance, Asset group performance, Custom GAQL"
        - "Audience and demographics: Ad group audience performance, Campaign audience performance, Age range performance, Gender performance, User interest and user list"
        - "Search and placement: Search query performance, Display keyword performance, Display topics performance, Placement performance, Landing page and Expanded landing page"
        - "Geography and network: Geographic performance by country, state, or region, User location performance, Campaign performance by ad network type"
        - "Other performance: Account performance, Click performance, Shopping performance, Responsive search ad performance, Video campaign performance"
        - "Structural: Accounts, Campaigns, Ad groups, Ads. Settings: Campaign budgets, Campaign criterion, Campaign labels, Bidding strategies, Labels"
        - "Metric categories: Budget, Clicks, Conversions, Cost, Performance, Cross sell and Sales, Video, Phone"
        - "Time splits: Date, Day of week, Week, Month, Quarter, Year"
      evidence_ids: [cpl-ads-data]
      note: >-
        Structural reports and Custom GAQL do not support time period splits, so one row per day is
        not available for them

    history:
      status: known
      value:
        - "You set a start and end date; no hard limit on the range is stated, but long ranges with daily splits are slow"
        - "For initial backfills the documentation recommends pulling in monthly or quarterly chunks to avoid API limits"
      evidence_ids: [cpl-ads-faq, cpl-ads-best]
      note: no fixed Google Ads retention window is stated

    refresh:
      status: known
      value:
        - A successful manual run is required before a schedule can be set
        - Scheduled refresh is described as hourly, daily, or a custom interval
        - The platform supports intervals from every 15 minutes to monthly, depending on plan
      evidence_ids: [cpl-claude-faq, cpl-refresh]
      note: Which intervals each plan allows is not documented

    multi_source:
      status: known
      value:
        - One data flow can take several sources and combine them with Join or Append before the data reaches Claude
        - Google Ads is documented as merging with Google Analytics, Facebook Ads, CRM, or e-commerce data for a full-funnel view of spend and results
      evidence_ids: [cpl-claude-faq, cpl-ads-overview]

    prerequisites:
      status: known
      value:
        - A Coupler.io account and a Claude account
        - On a Claude Team or Enterprise plan, admin access is needed to add the connector
      evidence_ids: [cpl-claude-destination]

    pricing:
      status: unknown
      value: null
      evidence_ids: []
      note: no pricing page was checked for this record

    data_path:
      status: known
      value: >-
        Coupler.io reads the Google Ads API, stores the result as a dataset, and serves it to Claude
        over its MCP server. Queries run on Coupler.io's side, so a large dataset does not have to
        fit into the model's context. Claude sees only datasets from data flows that have Claude as
        their destination.
      evidence_ids: [cpl-mcp]

    limits:
      status: known
      value:
        - "Google Ads API quota can be exceeded globally or per account, returning a 429 with a retry delay; the documented fix is to wait roughly 4 hours for the quota to reset"
        - "Rows with all-zero metrics are not returned by the API, so an ad or keyword with no activity in the period simply does not appear"
        - "Low-volume search terms are grouped under Other search terms to meet Google's privacy thresholds"
        - "Custom columns created in the Google Ads interface are not part of the API and cannot be pulled"
        - "Impression share metrics are not summable across rows"
        - "Performance Max campaigns have asset groups rather than traditional ads and ad groups"
        - "Custom GAQL returns cost as cost_micros, which must be divided by 1,000,000"
        - "Data is typically available within a few hours, but conversions may take 24 to 72 hours to finalise"
        - The Claude destination replaces data on each run; append mode is not supported
        - "On individual Claude Free and Pro plans the official connector may connect but fail to load its tools; a custom connector URL is documented as a workaround"
      evidence_ids: [cpl-ads-data, cpl-ads-issues, cpl-ads-faq, cpl-claude-destination, cpl-claude-issues, cpl-claude-free-pro]

    # Installing is only connecting the Coupler.io MCP server to Claude. Building the data flow that
    # feeds it is covered in Coupler.io's own docs (linked as the provider setup instructions).
    setup_steps: []

    claude_configuration:
      - text: In Claude web, Claude desktop, or Cowork, install the Coupler.io connector and click Connect, then connect again from the Connectors menu to authenticate.
        evidence_ids: [cpl-claude-destination]
      - text: In Claude Code, run the Coupler.io connection command in a new session, restart the session, then run /mcp, select Coupler.io, and click Authorize in the browser.
        evidence_ids: [cpl-claude-destination]
      - text: On a Claude Team or Enterprise plan, ask a workspace admin to add the connector if the option is unavailable.
        evidence_ids: [cpl-claude-issues]

    sample_query: Which campaigns increased spend but lost conversions last month, and how much of that was impression share lost to budget?

    success_check:
      text: >-
        Open a new Claude chat and ask it to list the datasets it can see. Claude asks permission to
        use the Coupler.io tools the first time; allow them, and your Coupler.io datasets are listed.
      evidence_ids: [cpl-claude-faq, cpl-claude-issues]

recommendations:
  - job: Reporting on spend over time or alongside analytics and CRM data
    option_id: coupler-io
    reason: >-
      Queries run against a stored dataset rather than the Ads API, which sidesteps the quota errors
      that bite on large backfills, and one data flow can join Google Ads with GA4 or CRM data
      before Claude sees it.
    evidence_ids: [cpl-mcp, cpl-ads-issues, cpl-ads-overview]
faq:
  - question: Can Claude pause a campaign or change my bids?
    answer: >-
      No. Coupler.io is read-only against Google Ads: Claude queries an imported dataset and cannot
      change campaigns, budgets, or bids.
    evidence_ids: [cpl-mcp]
  - question: Why does an import fail with a quota error?
    answer: >-
      The Google Ads API quota can be exhausted globally or per account, returning a 429 with a
      retry delay. The documented fix is to wait roughly 4 hours for the quota to reset, and to pull
      large backfills in monthly or quarterly chunks rather than years at once.
    evidence_ids: [cpl-ads-issues, cpl-ads-best]
  - question: Why are some campaigns or keywords missing from my data?
    answer: >-
      The Google Ads API does not return rows where every metric is zero, so anything with no
      activity in the period simply does not appear. Separately, low-volume search terms are grouped
      under Other search terms to meet Google's privacy thresholds, and custom columns built in the
      Google Ads interface are not available through the API at all.
    evidence_ids: [cpl-ads-issues, cpl-ads-data]
  - question: Why do my conversion numbers keep changing?
    answer: >-
      Google Ads data is typically available within a few hours, but conversions may take 24 to 72
      hours to finalise. A report pulled this morning about yesterday will often disagree with the
      same report pulled next week.
    evidence_ids: [cpl-ads-data, cpl-ads-faq]
  - question: Does my manager account give Claude access to all my sub-accounts?
    answer: >-
      No. Manager (MCC) access does not automatically grant data access to sub-accounts; each ad
      account needs explicit Standard or Admin access. Note also that each ad account you select
      counts as one account toward your Coupler.io plan limit, because Google Ads is a tenant-based
      source.
    evidence_ids: [cpl-ads-issues, cpl-ads-faq]

