recommendations:
  - job: Reporting on spend over time or alongside analytics and CRM data
    option_id: coupler-io
    reason: >-
      Queries run against a stored dataset rather than the Ads API, which sidesteps the quota errors
      that bite on large backfills, and one data flow can join Google Ads with GA4 or CRM data
      before Claude sees it.
    evidence_ids: [cpl-mcp, cpl-ads-issues, cpl-ads-overview]
  - job: Asking about live campaigns, or acting on them with approval
    option_id: notfair
    reason: >-
      It reads live Google Ads data and can propose pausing campaigns, adjusting bids, or adding
      negative keywords, with every write shown to you for confirmation, and it works on Claude web,
      Desktop, and Cowork without a Google Ads developer token.
    evidence_ids: [notfair-ads-guide]
  - job: A one-off question about a table you are already looking at
    option_id: manual-export
    reason: >-
      Export the statistics table in any of six formats and attach it. Nothing to install, and
      Google can email a scheduled copy if you need it regularly.
    evidence_ids: [ads-export-help, claude-upload-files]

faq:
  - question: Does Google's own Google Ads MCP server work with Claude?
    answer: >-
      Google publishes the server and documents it fully, but its page never names Claude, Claude
      Code, or Claude Desktop. The configuration example is generic and the deployment section uses
      Gemini's settings file as its example. So there is no vendor-tested Claude setup to follow,
      which is a real difference from Google's Analytics server, where a Claude Code command is
      given.
    evidence_ids: [google-ads-mcp-docs]
  - question: Can Claude pause a campaign or change my bids?
    answer: >-
      Only through NotFair, and only with your explicit approval: it shows every proposed write and
      requires confirmation. Google's own server is strictly read-only and states it cannot modify
      bids, pause campaigns, or create assets. Coupler.io is read-only against Google Ads.
    evidence_ids: [notfair-ads-guide, google-ads-mcp-docs, cpl-mcp]
  - question: Do I need a Google Ads developer token?
    answer: >-
      Not any more for Google's own server: developer tokens were sunset on 9 September 2026, and
      API access levels are now tied to your Google Cloud project, which needs Explorer, Basic, or
      Standard access. NotFair states you do not need your own token because it uses its own
      connection.
    evidence_ids: [google-ads-mcp-docs, notfair-ads-guide]
  - question: Why does an import fail with a quota error?
    answer: >-
      The Google Ads API quota can be exhausted globally or per account, returning a 429 with a
      retry delay. The documented fix is to wait roughly 4 hours for the quota to reset, and to pull
      large backfills in monthly or quarterly chunks rather than years at once.
    evidence_ids: [cpl-ads-issues, cpl-ads-best]
  - question: Why are some campaigns or keywords missing from my data?
    answer: >-
      The Google Ads API does not return rows where every metric is zero, so anything with no
      activity in the period simply does not appear. Separately, low-volume search terms are grouped
      under Other search terms to meet Google's privacy thresholds, and custom columns built in the
      Google Ads interface are not available through the API at all.
    evidence_ids: [cpl-ads-issues, cpl-ads-data]
  - question: Why do my conversion numbers keep changing?
    answer: >-
      Google Ads data is typically available within a few hours, but conversions may take 24 to 72
      hours to finalise. A report pulled this morning about yesterday will often disagree with the
      same report pulled next week, which matters most on routes that snapshot the data.
    evidence_ids: [cpl-ads-data, cpl-ads-faq]
  - question: Does my manager account give Claude access to all my sub-accounts?
    answer: >-
      No. Manager (MCC) access does not automatically grant data access to sub-accounts; each ad
      account needs explicit Standard or Admin access. Note also that each ad account you select
      counts as one account toward your Coupler.io plan limit, because Google Ads is a tenant-based
      source.
    evidence_ids: [cpl-ads-issues, cpl-ads-faq]

