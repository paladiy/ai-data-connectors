  coverage_note: >-
    Four routes were researched on 4 October 2026: the Coupler.io data platform, Google's own
    read-only MCP server, the third-party NotFair connector, and a manual export uploaded into a
    conversation. No dedicated Google Ads entry was reachable in Claude's connector directory at the
    obvious address, though several multi-source connectors list Google Ads among the platforms they
    cover; the directory cannot be searched exhaustively, so no claim is made that none exists.

