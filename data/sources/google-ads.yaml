# Every known claim below cites evidence that was read on the recorded date. Anything that the
# cited documentation does not state is left as status: unknown with a null value.
schema_version: 1
id: google-ads
slug: google-ads
name: Google Ads
aliases:
  - AdWords
  - Google Adwords
summary: >-
  Google ships an official Google Ads MCP server, but its documentation never names a Claude app,
  so following it means wiring up a generic MCP client yourself. The practical routes are a
  scheduled import, a third-party connector that can act on campaigns with your approval, or a
  plain export. This guide compares what each reaches and what it costs you in setup.

meta_description: Compare ways to connect Google Ads to Claude, with evidence for every capability claim.

