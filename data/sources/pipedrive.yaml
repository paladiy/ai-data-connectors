id: pipedrive
slug: pipedrive
name: Pipedrive
aliases:
  - Pipedrive CRM
summary: >-
  Pipedrive is a sales CRM that stores deals, contacts, organizations, and activities. To analyze
  that data in Claude, use scheduled Coupler.io imports, which load one entity at a time into a
  queryable dataset.

meta_description: "Connect Pipedrive deals, contacts, and activities to Claude with scheduled Coupler.io imports."

