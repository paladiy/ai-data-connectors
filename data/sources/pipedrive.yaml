options:
  - id: coupler-io
    name: Coupler.io
    provider: Coupler.io
    method: data_platform
    description: >-
      Coupler.io imports one Pipedrive entity per data flow on a schedule and exposes the result to
      Claude through its own MCP server, so Claude queries a stored dataset rather than calling
      Pipedrive during the conversation.

    maintainer:
      status: known
      value: third_party
      evidence_ids: [cpl-mcp, cpl-claude-destination]
      note: Coupler.io builds and runs this connector and its MCP server.

    route_status:
      status: known
      value: available
      evidence_ids: [cpl-claude-destination, cpl-pipedrive-claude-page]

    directory_listing:
      status: known
      value: https://claude.com/connectors/coupler-io
      evidence_ids: [dir-coupler-io]
      note: >-
        The entry is marked Anthropic verified, credited to Coupler.io, added in November 2025, and
        records sign-in as required. It lists four tools: get-data, get-schema, list-dataflows, and
        get-dataflow

    links:
      overview: https://docs.coupler.io/sources/category/crm/pipedrive
      setup: https://docs.coupler.io/destinations/categories/ai/claude

    # The Claude destination page names each of these surfaces for a single web connector.
    surfaces:
      claude_web:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination, cpl-claude-faq]
      claude_desktop:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Local use with Claude Desktop is also described through a Desktop Extension
      claude_code:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Connected with the /mcp command rather than the web connector
      cowork:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]

    access:
      status: known
      value: read
      evidence_ids: [cpl-mcp, dir-coupler-io]
      note: >-
        Queries against imported data are read-only, and nothing in either source describes writing
        back to Pipedrive. Coupler.io's own documentation also describes tools that change your
        Coupler.io workspace, such as creating a data flow or triggering a run, while the directory
        entry lists only the four read tools

    data_available:
      status: known
      value:
        - "Entities: Deals, Persons, Organizations, Activities, Files, Leads, Call logs, Products"
        - "A ninth entity, All deals (BETA), is named in troubleshooting and best practices but is not listed in either entity table"
        - "Per-entity options: a Pipedrive filter ID, a last-modified date range, and column selection"
        - "No Pipedrive reports: in-app analytics and forecast reports are not available through the API, so this is raw CRM data only"
      evidence_ids: [cpl-pipedrive-overview, cpl-pipedrive-data, cpl-pipedrive-issues]
      note: >-
        The overview says nine entities while both entity tables list eight; the count and the
        tables are not reconciled in the documentation

    history:
      status: unknown
      value: null
      evidence_ids: []
      note: >-
        no retention or backfill window is stated; the only date control documented is a
        last-modified filter, which can be left empty to export every record

    refresh:
      status: known
      value:
        - A successful manual run is required before a schedule can be set
        - Scheduled refresh is described as hourly, daily, or a custom interval
        - The platform supports intervals from every 15 minutes to monthly, depending on plan
      evidence_ids: [cpl-claude-faq, cpl-refresh]
      note: Which intervals each plan allows is not documented

    multi_source:
      status: known
      value:
        - One data flow can take several sources and combine them with Join or Append before the data reaches Claude
        - Each data flow exports one entity, so combining Deals with Persons means a flow for each and a join
        - "Documented join keys: Deals to Persons on person_id.value, and Deals to Organizations on org_id.value"
      evidence_ids: [cpl-claude-faq, cpl-pipedrive-data, cpl-pipedrive-best]

    prerequisites:
      status: known
      value:
        - A Pipedrive account with access to the data you want to export
        - The All deals (BETA) entity requires Pipedrive global admin access
        - A Coupler.io account and a Claude account
        - On a Claude Team or Enterprise plan, admin access is needed to add the connector
      evidence_ids: [cpl-pipedrive-overview, cpl-pipedrive-issues, cpl-claude-destination]
      note: >-
        The prerequisites list names no Pipedrive role or plan tier beyond account access; the
        documentation notes only that some plan levels restrict visibility of other users' activities

    pricing:
      status: unknown
      value: null
      evidence_ids: []
      note: no pricing page was checked for this record

    data_path:
      status: known
      value: >-
        Coupler.io reads the Pipedrive API, stores the result as a dataset, and serves it to Claude
        over its MCP server. Queries run on Coupler.io's side, so a large dataset does not have to
        fit into the model's context. Claude sees only datasets from data flows that have Claude as
        their destination.
      evidence_ids: [cpl-mcp]

    limits:
      status: known
      value:
        - "Pipedrive rate limits are 20 requests per 2 seconds on entry-level plans; Coupler.io paces requests automatically for large accounts, which lengthens run times"
        - "An import that does not finish within 30 minutes times out"
        - "Call logs are fetched at a maximum of 50 records per page, a Pipedrive API constraint"
        - "The Activities entity is fetched with user_id=0, so it returns activities from all users rather than only the connected account"
        - "The Pipedrive API returns active records only; deleted or archived deals, persons, and organizations are excluded"
        - "Date range filtering applies to Deals; for other entities it may have limited or no effect"
        - The Claude destination replaces data on each run; append mode is not supported
        - Row counts in Claude can differ from the Coupler.io preview when an identifier repeats, so the count should be checked in Claude
        - "On individual Claude Free and Pro plans the official connector may connect but fail to load its tools; a custom connector URL is documented as a workaround"
      evidence_ids: [cpl-pipedrive-data, cpl-pipedrive-issues, cpl-pipedrive-best, cpl-claude-destination, cpl-claude-issues, cpl-claude-free-pro]

    setup_steps:
      - text: In Coupler.io, create a data flow and add Pipedrive as the source, then choose the entity you want.
        evidence_ids: [cpl-claude-destination, cpl-pipedrive-data]
      - text: Narrow the export with a Pipedrive filter ID, a last-modified date range, or a column selection if you do not need every field.
        evidence_ids: [cpl-pipedrive-data]
      - text: Choose Claude as the destination in the data flow's destination step.
        evidence_ids: [cpl-claude-destination]
      - text: Give the data flow a clear name, because Claude refers to the dataset by that name.
        evidence_ids: [cpl-claude-destination]
      - text: Run the data flow manually once and wait for it to finish successfully.
        evidence_ids: [cpl-claude-destination]
      - text: Set a refresh schedule once that first run has succeeded.
        evidence_ids: [cpl-claude-faq]

    claude_configuration:
      - text: Install the Coupler.io connector in Claude and click Connect, then connect again from the Connectors menu to authenticate.
        evidence_ids: [cpl-claude-destination]
      - text: For Claude Code, start a session, paste the connection command shown in the destination step, restart the session, then run /mcp and authorise in the browser.
        evidence_ids: [cpl-claude-destination]
      - text: Approve the tool request the first time Claude fetches data in a session.
        evidence_ids: [cpl-claude-faq]
      - text: On a Claude Team or Enterprise plan, ask a workspace admin to add the connector if the option is unavailable.
        evidence_ids: [cpl-claude-issues]

    sample_query: Which deals have sat in the same stage longest, and what are they worth in total by owner?

    success_check:
      text: >-
        Open a new Claude chat and ask it to list the datasets it can see; the Pipedrive data flow
        should appear under the name you gave it. Then compare the row count Claude reports with the
        run in Coupler.io, because the preview alone does not confirm what Claude received.
      evidence_ids: [cpl-claude-destination, cpl-claude-issues]

recommendations:
  - job: Analysing sales history at length or alongside other systems
    option_id: coupler-io
    reason: >-
      Queries run against a stored dataset rather than the CRM, so a long deal history does not have
      to fit into the conversation, and one data flow can join Deals with Persons or Organizations
      before Claude sees them.
    evidence_ids: [cpl-mcp, cpl-pipedrive-best]
faq:
  - question: Can Claude update my CRM, or only read it?
    answer: >-
      Only read it. Coupler.io is read-only against Pipedrive: Claude queries an imported dataset
      and cannot create or change records.
    evidence_ids: [cpl-mcp]
  - question: Can I get my Pipedrive reports and forecasts into Claude?
    answer: >-
      Not as reports. Pipedrive's in-app analytics and forecast reports are not available through
      the API, so Coupler.io exports raw CRM data only and you would rebuild the analysis in Claude.
    evidence_ids: [cpl-pipedrive-data]
  - question: Why is my import slow or timing out?
    answer: >-
      Pipedrive rate limits entry-level plans to 20 requests per 2 seconds, and Coupler.io paces its
      requests automatically for large accounts, which lengthens runs. An import that does not finish
      within 30 minutes times out. Narrowing the export with a filter ID, a last-modified date range,
      or fewer columns is the documented way to keep runs short.
    evidence_ids: [cpl-pipedrive-issues, cpl-pipedrive-data]
  - question: Will an import include deals I have deleted or archived?
    answer: >-
      No. The Pipedrive API returns active records only, so deleted and archived deals, persons, and
      organizations are excluded from a Coupler.io import.
    evidence_ids: [cpl-pipedrive-best]
  - question: Does the activity data cover my whole team?
    answer: >-
      Yes, and that may surprise you. Coupler.io fetches the Activities entity with user_id=0, which
      returns activities from all Pipedrive users rather than only the connected account. Separately,
      some Pipedrive plan levels restrict visibility of other users' activities.
    evidence_ids: [cpl-pipedrive-data, cpl-pipedrive-issues]
  - question: The connector shows as connected but Claude cannot see my data. Why?
    answer: >-
      On individual Claude Free and Pro plans there is a documented defect where the official
      Coupler.io connector connects but its tools never load, so Claude cannot query the datasets.
      Coupler.io documents a custom connector URL as a workaround and reports that it works on all
      plans.
    evidence_ids: [cpl-claude-free-pro]

