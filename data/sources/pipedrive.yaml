id: pipedrive
slug: pipedrive
name: Pipedrive
aliases:
  - Pipedrive CRM
summary: >-
  Pipedrive is a sales CRM that stores deals, contacts, organizations, and activities. To analyze
  that data in Claude, you can use Pipedrive's own connector in Claude's directory, which reads live
  data and can create and update records, or scheduled Coupler.io imports, which load one entity at
  a time into a queryable dataset.

meta_description: "Connect Pipedrive deals, contacts, and activities to Claude: Pipedrive's own live connector or scheduled Coupler.io imports. Compared with cited evidence."

