options:
  - id: coupler-io
    name: Coupler.io
    provider: Coupler.io
    method: data_platform
    description: >-
      Coupler.io imports QuickBooks Online entities or reports on a schedule and exposes the result
      to Claude through its own MCP server, so Claude queries a stored dataset rather than calling
      Intuit directly.

    maintainer:
      status: known
      value: third_party
      evidence_ids: [cpl-mcp, cpl-claude-destination]
      note: Coupler.io builds and runs this connector and its MCP server.

    route_status:
      status: known
      value: available
      evidence_ids: [cpl-claude-destination, cpl-qbo-claude-page]

    directory_listing:
      status: known
      value: https://claude.com/connectors/coupler-io
      evidence_ids: [dir-coupler-io]
      note: >-
        The entry is marked Anthropic verified, credited to Coupler.io, added in November 2025, and
        records sign-in as required. It lists four tools: get-data, get-schema, list-dataflows, and
        get-dataflow

    links:
      overview: https://docs.coupler.io/sources/category/finance-and-accounting/quickbooks
      setup: https://docs.coupler.io/destinations/categories/ai/claude

    # The Claude destination page names each of these surfaces for a single web connector.
    surfaces:
      claude_web:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination, cpl-claude-faq]
      claude_desktop:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Local use with Claude Desktop is also described through a Desktop Extension
      claude_code:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]
        note: Connected with the /mcp command rather than the web connector
      cowork:
        status: known
        value: supported
        evidence_ids: [cpl-claude-destination]

    access:
      status: known
      value: read
      evidence_ids: [cpl-mcp, dir-coupler-io]
      note: >-
        Queries against imported data are read-only, and nothing in either source describes writing
        back to QuickBooks Online. Coupler.io's own documentation also describes tools that change
        your Coupler.io workspace, such as creating a data flow or triggering a run, while the
        directory entry lists only the four read tools; the two sources disagree on how much of that
        workspace control the connector currently exposes

    data_available:
      status: known
      value:
        - "Entities: Invoice, Customer, Bill, Payment, Vendor, Employee, Estimate, Purchase, PurchaseOrder, SalesReceipt, CreditMemo, Deposit, Transfer, JournalEntry, Account, Item, Budget, TimeActivity"
        - "Further entities: Attachable, BillPayment, Class, CompanyInfo, Department, ExchangeRate, JournalCode, PaymentMethod, Preferences, RefundReceipt, TaxAgency, TaxCode, TaxRate, Term, VendorCredit"
        - "Summary reports: Profit and Loss Summary, Balance Sheet, Cash Flow, Trial Balance, Expenses by Vendor, Sales by Customer, Sales by Product, Sales by Class Summary, Sales by Department, Tax Summary, Inventory Valuation Summary"
        - "Detail reports: Profit and Loss Detail, General Ledger Detail, Transaction List, Transaction List by Customer, Transaction List by Vendor, Transaction List with Splits, Journal Report"
        - "Aging and balance reports: AP Aging Detail and Summary, AR Aging Detail and Summary, Customer Balance and Detail, Vendor Balance and Detail, Customer Income, Account List Detail"
      evidence_ids: [cpl-qbo-data]
      note: Raw entities and pre-built reports are two separate sources; one entity or report per data flow

    history:
      status: unknown
      value: null
      evidence_ids: []
      note: >-
        no retention or backfill window is stated; the documented constraint is the size of a single
        report rather than how far back it can reach

    refresh:
      status: known
      value:
        - A successful manual run is required before a schedule can be set
        - Scheduled refresh is described as hourly, daily, or a custom interval
        - The platform supports intervals from every 15 minutes to monthly, depending on plan
      evidence_ids: [cpl-claude-faq, cpl-refresh]
      note: Which intervals each plan allows is not documented

    multi_source:
      status: known
      value:
        - One data flow can take several sources and combine them with Join or Append before the data reaches Claude
        - Within Claude, a SQL dataset can be built from datasets in the same data flow, because one query reads one dataset
      evidence_ids: [cpl-claude-faq, cpl-mcp]

    prerequisites:
      status: known
      value:
        - A QuickBooks Online account on Simple Start, Essentials, Plus, or Advanced
        - Admin or Accountant access to the company file
        - Classes, Locations, and Budgets require the Plus or Advanced tier
        - A Coupler.io account and a Claude account
        - On a Claude Team or Enterprise plan, admin access is needed to add the connector
      evidence_ids: [cpl-qbo-overview, cpl-qbo-faq, cpl-claude-destination]

    pricing:
      status: unknown
      value: null
      evidence_ids: []
      note: no pricing page was checked for this record

    data_path:
      status: known
      value: >-
        Coupler.io reads the QuickBooks Online API, stores the result as a dataset, and serves it to
        Claude over its MCP server. Queries run on Coupler.io's side, so a large dataset does not
        have to fit into the model's context. Claude sees only datasets from data flows that have
        Claude as their destination.
      evidence_ids: [cpl-mcp]

    limits:
      status: known
      value:
        - "The QuickBooks Reports API truncates any report above 400,000 cells (rows times columns); this is Intuit's limit and cannot be raised"
        - QuickBooks Desktop, including Desktop Enterprise and Desktop Pro, is not supported
        - The QuickBooks query language supports AND but not OR, and reports can be grouped by only one dimension at a time
        - Custom reports built in the QuickBooks interface are not available through the API
        - Entity exports return only active records by default
        - The Claude destination replaces data on each run; append mode is not supported
        - Row counts in Claude can differ from the Coupler.io preview when an identifier repeats, so the count should be checked in Claude
        - "On individual Claude Free and Pro plans the official connector may connect but fail to load its tools; a custom connector URL is documented as a workaround"
      evidence_ids: [cpl-qbo-data, cpl-qbo-faq, cpl-qbo-issues, cpl-claude-destination, cpl-claude-issues, cpl-claude-free-pro]

    setup_steps:
      - text: In Coupler.io, create a data flow and add QuickBooks as the source, choosing either an entity or a pre-built report.
        evidence_ids: [cpl-claude-destination, cpl-qbo-data]
      - text: Choose Claude as the destination in the data flow's destination step.
        evidence_ids: [cpl-claude-destination]
      - text: Give the data flow a clear name, because Claude refers to the dataset by that name.
        evidence_ids: [cpl-claude-destination]
      - text: Run the data flow manually once and wait for it to finish successfully.
        evidence_ids: [cpl-claude-destination]
      - text: Set a refresh schedule once that first run has succeeded.
        evidence_ids: [cpl-claude-faq]

    claude_configuration:
      - text: Install the Coupler.io connector in Claude and click Connect, then connect again from the Connectors menu to authenticate.
        evidence_ids: [cpl-claude-destination]
      - text: For Claude Code, start a session, paste the connection command shown in the destination step, restart the session, then run /mcp and authorise in the browser.
        evidence_ids: [cpl-claude-destination]
      - text: Approve the tool request the first time Claude fetches data in a session.
        evidence_ids: [cpl-claude-faq]
      - text: On a Claude Team or Enterprise plan, ask a workspace admin to add the connector if the option is unavailable.
        evidence_ids: [cpl-claude-issues]

    sample_query: Which vendors did we spend the most with last quarter, and how does that compare with the quarter before?

    success_check:
      text: >-
        Open a new Claude chat and ask it to list the datasets it can see; the QuickBooks data flow
        should appear under the name you gave it. Then compare the row count Claude reports with the
        run in Coupler.io, because the preview alone does not confirm what Claude received.
      evidence_ids: [cpl-claude-destination, cpl-claude-issues]

  - id: intuit-quickbooks
    name: Intuit QuickBooks connector
    provider: Intuit
    method: remote_mcp
    description: >-
      Intuit's own connector in Claude's directory. Claude calls Intuit's hosted MCP endpoint when
      you ask a question, and the same connection can create and send invoices as well as read
      reports.

    maintainer:
      status: known
      value: source_vendor
      evidence_ids: [dir-intuit-quickbooks]
      note: The directory entry credits Intuit QuickBooks as the maker and marks it Anthropic verified

    route_status:
      status: known
      value: available
      evidence_ids: [dir-intuit-quickbooks]
      note: Recorded in the directory as added in March 2026

    directory_listing:
      status: known
      value: https://claude.com/connectors/quickbooks
      evidence_ids: [dir-intuit-quickbooks]

    links:
      overview: https://claude.com/connectors/quickbooks
      setup: https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities

    # Anthropic's help article states where connectors run. It describes connectors as a class rather
    # than this entry specifically, which is recorded in each note.
    surfaces:
      claude_web:
        status: known
        value: supported
        evidence_ids: [claude-connectors-help]
        note: Web connectors are stated to be available to all users on Claude, with mobile covered too
      claude_desktop:
        status: known
        value: supported
        evidence_ids: [claude-connectors-help]
        note: Claude Desktop is named among the apps where web connectors are available
      claude_code:
        status: known
        value: supported
        evidence_ids: [claude-connectors-help]
        note: >-
          The article states that connectors work across Claude, Claude Desktop, Claude Code, and the
          API; it does not describe a Claude Code setup for this connector specifically
      cowork:
        status: known
        value: supported
        evidence_ids: [claude-connectors-help]
        note: Cowork is named among the apps where web connectors are available

    access:
      status: known
      value: read_write
      evidence_ids: [dir-intuit-quickbooks]
      note: >-
        The entry describes creating, updating, sending, duplicating, and scheduling invoices and
        estimates, adding customers and products, and sending payment links and reminders, always
        with a preview and your confirmation before anything is sent. Payroll and QuickBooks Capital
        are described as fast read-only answers, though adding an employee or setting base pay is
        also listed

    data_available:
      status: known
      value:
        - "Reports: profit and loss, cash flow, balance sheet, A/R aging summary and detail, sales by customer summary, sales by product summary, product and service list"
        - "Entities: customers (create and search), invoices (create, update, delete, duplicate, send, read), estimates, products, payment links and reminders"
        - "Benchmarking: performance against similar businesses by industry and region, plus peer lending benchmarks"
        - "Payroll and lending: payroll detail lookups, adding an employee or setting base pay, and QuickBooks Capital loan details"
        - "Transaction import: CSVs, PDFs, or images can be uploaded, or transactions pasted, with an import status tool"
        - "74 tools in total; the entry shows the first 24 and hides the rest behind a Show all control"
      evidence_ids: [dir-intuit-quickbooks]

    history:
      status: unknown
      value: null
      evidence_ids: []
      note: the entry does not state how far back the connector can reach

    refresh:
      status: not_applicable
      value: null
      evidence_ids: [dir-intuit-quickbooks]
      note: >-
        There is no import to schedule. The entry publishes an MCP endpoint that Claude calls when
        you ask a question; whether Intuit caches anything behind it is not described

    multi_source:
      status: not_applicable
      value: null
      evidence_ids: [dir-intuit-quickbooks]
      note: >-
        This connector reaches QuickBooks Online only. Combining it with another system means adding
        that system's own connector and asking Claude to work across both in the conversation

    prerequisites:
      status: known
      value:
        - "Sign-in is recorded as not required, so the connector can be added before any QuickBooks account is linked"
        - "Without a QuickBooks account, the entry describes uploading CSVs, PDFs, or images, or pasting transactions directly"
        - "A Claude account on an app where connectors are available"
      evidence_ids: [dir-intuit-quickbooks, claude-connectors-help]

    pricing:
      status: unknown
      value: null
      evidence_ids: []
      note: the entry states no price and no QuickBooks tier requirement

    data_path:
      status: known
      value: >-
        Claude calls Intuit's hosted MCP endpoint at https://ai-inc.quickbooks.intuit.com/v1/mcp and
        the result comes back into the conversation. Claude inherits your permissions in the
        connected service, so anything you cannot reach in QuickBooks the connector cannot reach
        either.
      evidence_ids: [dir-intuit-quickbooks, claude-connectors-help]

    limits:
      status: known
      value:
        - "Anthropic states that it does not control which tools developers make available and cannot verify that they will work as intended or that they will not change"
        - "The entry lists 74 tools but shows only the first 24 without expanding the list, so the full surface cannot be read from the page"
        - "Results arrive in the conversation rather than in a queryable store, so a wide report competes with the rest of the context"
      evidence_ids: [dir-intuit-quickbooks]

    setup_steps:
      - text: Open the connector's directory entry and choose Add to Claude.
        evidence_ids: [dir-intuit-quickbooks]

    claude_configuration:
      - text: "Or add it from a chat: click the + button in the lower left, hover over Connectors, and select Manage connectors."
        evidence_ids: [claude-connectors-help]
      - text: Approve the connector's tool request the first time Claude uses it in a conversation.
        evidence_ids: [claude-connectors-help]

    sample_query: Which customers owe us the most right now, and which of those invoices are more than 60 days overdue?

    success_check:
      text: >-
        Ask Claude for your A/R aging summary. A working connection answers with figures from your
        QuickBooks company rather than asking you to upload a file.
      evidence_ids: [dir-intuit-quickbooks]

  - id: intuit-local-mcp
    name: QuickBooks Online MCP Server (local)
    provider: Intuit
    method: local_mcp
    description: >-
      An open-source MCP server you run on your own machine against your own Intuit developer app.
      It covers far more of the QuickBooks API than the directory connector, at the cost of an OAuth
      setup you maintain yourself.

    maintainer:
      status: known
      value: source_vendor
      evidence_ids: [intuit-local-mcp-readme]
      note: >-
        Published in Intuit's GitHub organisation under the MIT licence. The README's own clone
        command still points at a different repository path than the published one, so copying it
        verbatim will not work

    route_status:
      status: known
      value: available
      evidence_ids: [intuit-local-mcp-readme]

    directory_listing:
      status: not_applicable
      value: null
      evidence_ids: [intuit-local-mcp-readme]
      note: A local server is configured by hand in your MCP client, not added from Claude's directory

    links:
      overview: https://github.com/intuit/quickbooks-online-mcp-server

    surfaces:
      claude_web:
        status: unknown
        value: null
        evidence_ids: []
        note: the README does not name Claude on the web
      claude_desktop:
        status: unknown
        value: null
        evidence_ids: []
        note: the README does not name Claude Desktop
      claude_code:
        status: known
        value: supported
        evidence_ids: [intuit-local-mcp-readme]
        note: The README names Claude Code and includes a Claude Code MCP configuration block
      cowork:
        status: unknown
        value: null
        evidence_ids: []
        note: the README does not name Cowork

    access:
      status: known
      value: read_write
      evidence_ids: [intuit-local-mcp-readme]
      note: >-
        Create, read, update, delete, and search across 29 entity types. Each write group can be
        switched off with QUICKBOOKS_DISABLE_WRITE, QUICKBOOKS_DISABLE_UPDATE, and
        QUICKBOOKS_DISABLE_DELETE; the README states that read tools are always registered, so a
        read-only setup is a configuration choice rather than a separate install

    data_available:
      status: known
      value:
        - "145 tools in total across 29 entity types and 11 financial reports"
        - "Entities with full create, read, update, delete, and search: Customer, Invoice, Estimate, Bill, Vendor, Employee, Item, Journal Entry, Bill Payment, Purchase, Payment, Sales Receipt, Credit Memo, Refund Receipt, Purchase Order, Vendor Credit, Deposit, Transfer, Time Activity, Attachable"
        - "Entities without delete: Account, Class, Department, Term, Payment Method"
        - "Read and search only: Tax Code, Tax Rate, Tax Agency. Company Info is read and update only"
        - "Reports include Balance Sheet, Profit and Loss, Cash Flow, Trial Balance, General Ledger, Customer Sales, and Aged Receivables"
      evidence_ids: [intuit-local-mcp-readme]

    history:
      status: unknown
      value: null
      evidence_ids: []
      note: the README does not state a retention or backfill window

    refresh:
      status: not_applicable
      value: null
      evidence_ids: [intuit-local-mcp-readme]
      note: >-
        There is no import to schedule. The server calls the QuickBooks Online API when Claude uses
        a tool

    multi_source:
      status: not_applicable
      value: null
      evidence_ids: [intuit-local-mcp-readme]
      note: >-
        One server instance is bound to one QuickBooks company through QUICKBOOKS_REALM_ID. The
        README describes pointing each connection at its own token file, so separate companies mean
        separate configured instances

    prerequisites:
      status: known
      value:
        - "An app registered on the Intuit Developer Portal, with its client ID and client secret"
        - "A one-time browser-based OAuth handshake; sandbox accepts an http://localhost redirect URI, production requires a public HTTPS callback"
        - "A refresh token and the realm ID of the QuickBooks company"
        - "Node on the machine that runs the server, to install dependencies and build the project"
      evidence_ids: [intuit-local-mcp-readme]

    pricing:
      status: known
      value:
        - Published under the MIT licence
      evidence_ids: [intuit-local-mcp-readme]
      note: no charge is stated for the server itself; the Intuit developer app and your own machine are separate

    data_path:
      status: known
      value: >-
        The server runs as a stdio subprocess on your own machine and authenticates to a QuickBooks
        Online company with your OAuth token, so the request path is your machine to Intuit. Results
        come back into the conversation.
      evidence_ids: [intuit-local-mcp-readme]

    limits:
      status: known
      value:
        - "Production authorisation needs a public HTTPS callback; only sandbox accepts http://localhost"
        - "The refresh token lapses after 100 days, which means repeating the browser handshake"
        - "The server writes the rotated refresh token back into its .env on every refresh, so a read-only or containerised install must set QUICKBOOKS_TOKEN_STORE_PATH to an absolute writable path in the host process environment, not inside .env"
        - "When QUICKBOOKS_TOKEN_STORE_PATH is set, the package's own .env is not read at all, so credentials must live in the file it points to"
        - "The README's clone command points at a repository path that differs from the published one"
      evidence_ids: [intuit-local-mcp-readme]

    setup_steps:
      - text: Register an app on the Intuit Developer Portal and note its client ID and client secret.
        evidence_ids: [intuit-local-mcp-readme]
      - text: Clone the repository, install dependencies, and build the project.
        evidence_ids: [intuit-local-mcp-readme]
      - text: Complete the one-time browser OAuth handshake to obtain a refresh token for your sandbox or production company.
        evidence_ids: [intuit-local-mcp-readme]
      - text: Copy .env.example to .env and fill in the client ID, client secret, refresh token, realm ID, and environment.
