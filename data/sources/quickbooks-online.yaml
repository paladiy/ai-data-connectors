recommendations:
  - job: Analysing QuickBooks figures alongside other systems
    option_id: coupler-io
    reason: >-
      One data flow can join or append several sources before Claude sees them, and queries run
      against the stored dataset rather than the QuickBooks API, so a large report does not have to
      fit into the conversation.
    evidence_ids: [cpl-claude-faq, cpl-mcp]
  - job: Asking about your finances in Claude with the least setup
    option_id: intuit-quickbooks
    reason: >-
      It is added from Claude's directory in one step, sign-in is recorded as not required, and it
      is Intuit's own connector rather than an intermediary.
    evidence_ids: [dir-intuit-quickbooks]
  - job: Keeping QuickBooks credentials on hardware you control
    option_id: intuit-local-mcp
    reason: >-
      The server runs as a subprocess on your own machine against your own Intuit app under the MIT
      licence, and the write, update, and delete tool groups can each be switched off while read
      tools stay available.
    evidence_ids: [intuit-local-mcp-readme]
  - job: Building your own agent product on QuickBooks data
    option_id: intuit-hosted-mcp-pilot
    reason: >-
      Intuit offers this hosted endpoint to App Partner Program members specifically for agentic
      use, with per-object OAuth scopes, while directing code-driven integrations to the REST API.
    evidence_ids: [intuit-hosted-mcp-pilot]

faq:
  - question: Does this work with QuickBooks Desktop?
    answer: >-
      No. Coupler.io connects to the QuickBooks Online API only, and the documentation states that
      Desktop, including Desktop Enterprise and Desktop Pro, is not supported. Moving to QuickBooks
      Online would be a prerequisite.
    evidence_ids: [cpl-qbo-faq, cpl-qbo-overview]
  - question: Can Claude create or send an invoice, or only read my books?
    answer: >-
      It depends on the route. Intuit's directory connector describes creating, updating, sending,
      duplicating, and scheduling invoices and estimates, with a preview and your confirmation
      before anything is sent, and Intuit's local server and hosted pilot both expose write tools
      too. Coupler.io is read-only against QuickBooks: Claude queries an imported dataset, and
      nothing in its documentation describes writing back to your books.
    evidence_ids: [dir-intuit-quickbooks, intuit-local-mcp-readme, intuit-hosted-mcp-pilot, cpl-mcp]
  - question: Which route gets me the most QuickBooks data?
    answer: >-
      Measured by API coverage, Intuit's local MCP server is the widest: 145 tools across 29 entity
      types and 11 reports, with full create, read, update, delete, and search on most entities. Its
      directory connector lists 74 tools. Coupler.io covers more than 30 entities and over 30
      pre-built reports, but with a different shape, because it imports one entity or report per
      data flow into a dataset Claude then queries.
    evidence_ids: [intuit-local-mcp-readme, dir-intuit-quickbooks, cpl-qbo-data]
  - question: Which Claude apps can read the data once it is connected?
    answer: >-
      Coupler.io's documentation names Claude web, Claude desktop, mobile, Cowork, and Claude Code,
      and says a single web connector covers them; Claude Code is connected with the /mcp command
      instead. The connector only needs to be installed once.
    evidence_ids: [cpl-claude-destination, cpl-claude-faq]
  - question: Can Claude change my accounting data?
    answer: >-
      Queries against the imported data are documented as read-only, so the model cannot edit,
      delete, or overwrite imported rows. The same connection does expose tools that can change your
      Coupler.io workspace, such as creating a data flow or triggering a run, and the documentation
      says the model is instructed to confirm before making a change you did not ask for.
    evidence_ids: [cpl-mcp]
  - question: Why can my reports get cut off?
    answer: >-
      The QuickBooks Reports API truncates a report once it exceeds 400,000 cells, counting rows
      times columns. This is Intuit's limit, and the documentation says there is no way to raise it,
      so a long date range on a wide report has to be split up.
    evidence_ids: [cpl-qbo-data, cpl-qbo-issues]
  - question: The connector shows as connected but Claude cannot see my data. Why?
    answer: >-
      On individual Claude Free and Pro plans there is a documented defect where the official
      connector connects but its tools never load, so Claude cannot query the datasets. Coupler.io
      documents a custom connector URL as a workaround and reports that it works on all plans.
    evidence_ids: [cpl-claude-free-pro]

