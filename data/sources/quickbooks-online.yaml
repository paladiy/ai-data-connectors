# Every known claim below cites evidence that was read on the recorded date. Anything that the
# cited documentation does not state is left as status: unknown with a null value.
schema_version: 1
id: quickbooks-online
slug: quickbooks-online
name: QuickBooks Online
aliases:
  - QBO
  - QuickBooks
  - Intuit QuickBooks
summary: >-
  QuickBooks Online holds the transactions behind your financial reports, and the practical question
  is how much of that detail Claude can actually reach. This guide compares each route on the data it
  exposes, the Claude apps it works in, the access it asks for, and the limits that bite at month end.

meta_description: Compare ways to connect QuickBooks Online to Claude, with evidence for every capability claim.

research:
  searched_on: "2026-10-04"
  checked_urls:
    - https://docs.coupler.io/sources/category/finance-and-accounting/quickbooks
    - https://docs.coupler.io/sources/category/finance-and-accounting/quickbooks/data-overview
    - https://docs.coupler.io/sources/category/finance-and-accounting/quickbooks/faq
    - https://docs.coupler.io/sources/category/finance-and-accounting/quickbooks/common-issues
    - https://docs.coupler.io/destinations/categories/ai/claude
    - https://docs.coupler.io/destinations/categories/ai/claude/faq
    - https://docs.coupler.io/destinations/categories/ai/claude/common-issues
    - https://docs.coupler.io/ai/mcp
    - https://claude.com/connectors/coupler-io
    - https://claude.com/connectors/quickbooks
    - https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
    - https://github.com/intuit/quickbooks-online-mcp-server
    - https://intuitdeveloper.github.io/intuit-3p-ai-pilot/
  coverage_note: >-
    Four routes were researched on 4 October 2026: the Coupler.io data platform, Intuit's connector
    in Claude's directory, Intuit's open-source local MCP server, and Intuit's invitation-only
    hosted MCP pilot. Each route's own documentation was read in full, covering the data available,
    prerequisites, access, and limits. Manual export of QuickBooks reports is a fifth route that is
    missing here: every Intuit help-centre page for it returned a server error on the day of
    research, so no export facts are recorded rather than guessed.

