schema_version: 1
id: quickbooks-online
slug: quickbooks-online
name: QuickBooks Online
aliases:
  - QBO
  - QuickBooks
  - Intuit QuickBooks
summary: >-
  QuickBooks Online is Intuit's cloud accounting software. It stores invoices, customers, vendors,
  transactions, and financial reports such as profit and loss and A/R aging. To analyze that data in
  Claude, use scheduled Coupler.io imports.

meta_description: "Connect QuickBooks Online invoices, customers, and financial reports to Claude with scheduled Coupler.io imports."

