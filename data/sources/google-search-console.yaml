  coverage_note: >-
    Three routes are covered, chosen from the five researched on 4 October 2026: the Coupler.io data
    platform, the GSC PAP hosted connector, and a community MCP server you can self-host. No Search Console MCP server published by Google was found, and
    no dedicated Search Console entry was reachable in Claude's connector directory at the obvious
    address; neither absence can be proven, so both are recorded as not found rather than as
    non-existent.

