# Every known claim below cites evidence that was read on the recorded date. Anything that the
# cited documentation does not state is left as status: unknown with a null value.
schema_version: 1
id: google-search-console
slug: google-search-console
name: Google Search Console
aliases:
  - GSC
  - Search Console
  - Webmaster Tools
summary: >-
  Google Search Console is Google's free tool for monitoring how a website performs in Google
  Search. Its data covers queries, clicks, impressions, average position, pages, and URL index
  status. Google offers no MCP server for it, so Claude reaches it through scheduled Coupler.io
  imports, the hosted GSC PAP service, or a community MCP server you run yourself.

meta_description: "Connect Google Search Console queries, clicks, impressions, and index status to Claude: Coupler.io import, GSC PAP, or a community MCP server."

