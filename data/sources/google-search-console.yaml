schema_version: 1
id: google-search-console
slug: google-search-console
name: Google Search Console
aliases:
  - GSC
  - Search Console
  - Webmaster Tools
summary: >-
  Google Search Console is Google's free tool for monitoring how a website performs in Google
  Search. Its data covers queries, clicks, impressions, average position, pages, and URL index
  status. To analyze it in Claude, use scheduled Coupler.io imports.

meta_description: "Connect Google Search Console queries, clicks, impressions, and index status to Claude with scheduled Coupler.io imports."

