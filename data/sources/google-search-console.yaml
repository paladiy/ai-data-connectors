    - https://docs.coupler.io/destinations/categories/ai/claude
    - https://docs.coupler.io/destinations/categories/ai/claude/faq
    - https://docs.coupler.io/destinations/categories/ai/claude/common-issues
    - https://docs.coupler.io/ai/mcp
    - https://claude.com/connectors/coupler-io
    - https://support.claude.com/en/articles/11176164-use-connectors-to-extend-claude-s-capabilities
