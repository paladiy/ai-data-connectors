schema_version: 1
id: facebook-ads
slug: facebook-ads
name: Facebook Ads
aliases:
  - Meta Ads
  - Facebook Ads Manager
summary: >-
  Facebook Ads (Meta Ads) is Meta's advertising platform for campaigns across Facebook, Instagram,
  Messenger, and the Audience Network. Its data covers campaigns, ad sets, ads, creatives, spend,
  reach, clicks, and conversions. To analyze it in ChatGPT, Claude, Gemini, or another LLM, use
  scheduled Coupler.io imports.

meta_description: "Connect Facebook Ads (Meta Ads) spend, reach, and conversion data to ChatGPT, Claude, Gemini, and other LLMs with scheduled Coupler.io imports."

