name: Sync skills

# Refreshes the pinned snapshot of coupler-io/skills so the committed guides keep listing the
# skills that exist. It opens one pull request for the owner to review and merge by hand; it
# never writes to main. A scheduled workflow is disabled after 60 days without repository
# activity, so re-enable it from the Actions tab if it goes quiet.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Refresh the upstream snapshot
        id: sync
        run: npm run sync:skills

      # A pull request opened with the default GITHUB_TOKEN does not start another workflow, so
      # ci.yml will not run on it. Every check it would have run is repeated here, before the
      # pull request is opened, so a bad snapshot is never proposed for merge.
      - name: Regenerate and run every check from ci.yml
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm run generate
          npm run check:private
          npm run typecheck
          npm run validate
          npm test
          npm run check:generated
          npm run build

      - name: Open or update the snapshot pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/sync-skills
          # Only the snapshot and what is generated from it; nothing else can ride along.
          add-paths: |
            data/upstream/
            guides/
            README.md
            llms.txt
          commit-message: |
            Update the skills snapshot to coupler-io/skills@${{ steps.sync.outputs.short }}

            Generated by .github/workflows/sync-skills.yml. Review the guide changes
            before merging.
          title: Update the skills snapshot to coupler-io/skills@${{ steps.sync.outputs.short }}
          body-path: reports/skills-sync.md
          delete-branch: true
